# Only the ARIADNA Traceability Database Service can be containerized; the desktop application cannot.

services:

  ariadna-db:
    image: postgres:16.2
    container_name: ariadna-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5442:5432"
    volumes:
      - ariadna_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ariadna_network]

volumes:
  ariadna_db_data:

networks:
  ariadna_network:
    driver: bridge
